name: Build ReShade SM86 Loader

on:
  push:
    branches:
      - tooling/reshade-sm86-loader
    paths:
      - tools/reshade-sm86-loader/**
      - .github/workflows/build-reshade-sm86-loader.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build addon
        shell: cmd
        run: |
          if not exist dist mkdir dist
          cl /nologo /std:c++17 /O2 /MT /EHsc /LD tools\reshade-sm86-loader\SM86Loader.cpp /link /OUT:dist\SM86Loader.addon64 || exit /b 1
          if not exist dist\SM86Loader.addon64 exit /b 1
          copy tools\reshade-sm86-loader\README.md dist\README.md || exit /b 1
          copy tools\reshade-sm86-loader\dlssg_sm86.example.ini dist\dlssg_sm86.example.ini || exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReShade-SM86-Loader-x64
          path: dist/
          if-no-files-found: error
